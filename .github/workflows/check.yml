name: Check
# main 的 PR 合并前须通过完整检查。preview 推送后跑同样的检查，用于发现组合版本的问题。
on:
  pull_request:
    branches: [main]
  push:
    branches: [preview]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: shellcheck install.sh scripts/update-preview.sh
