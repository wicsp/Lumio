name: Check
# PR 与 main 都跑完整检查。默认流程先合并后在 main 上跑 CI，失败时修复或撤回（PR #188）。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: shellcheck install.sh
