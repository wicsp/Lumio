name: Check
# 只在 PR 上检查：所有改动都经 PR 合并，检查通过后才合并（自动合并）。发布前 release.yml 在 macOS 上再跑一遍。
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: shellcheck install.sh
