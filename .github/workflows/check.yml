name: Check
# main 的 PR 跑完整检查。preview 通过相关测试和构建后直接推送。
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: shellcheck install.sh scripts/update-preview.sh
